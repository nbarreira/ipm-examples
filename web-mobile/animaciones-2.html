
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animación optimizada</title>
<style>
.container {
    position: relative;
    width: 100%;
    height: 200px;
    overflow: hidden;
    background: #eee;
}

.card {
    position: absolute;
    left: 0;
    top: 50px;
    width: 100px;
    height: 100px;
    background: steelblue;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: move 3s infinite alternate ease-in-out;
    transition: transform 0.3s;
}

.card:hover {
    transform: scale(1.3);
}

@keyframes move {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(80vw);
    }
}
</style>
</head>
<body>
    <div class="container">
        <div class="card">Animación</div>
    </div>
</body>
</html>
