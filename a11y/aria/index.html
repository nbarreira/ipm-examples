<!DOCTYPE html>
<html lang="en">

<head>
    <title>IPM A11y Example</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css"
        integrity="sha512-YWzhKL2whUzgiheMoBFwW8CKV4qpHQAEuvilg9FAn5VJUDwKZZxkJNuGM4XkWuk94WCrrwslk8yWNGmY1EduTA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <header>
        <button type="button" aria-controls="menu" aria-label="Menu" aria-expanded="false">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <nav aria-label="Main menu">
            <ul id="menu" hidden>
                <li><a href="#">Menu 1</a></li>
                <li><a href="#">Menu 2</a></li>
                <li><a href="#">Menu 3</a></li>
                <li><a href="#">Menu 4</a></li>
            </ul>
        </nav>
        <h1>A11y example</h1>
    </header>

    <main>
        <h2>Form</h2>

        <form id="form">
            <label for="field1">Email</label>
            <input type="text" id="field1" required aria-required="true" aria-invalid="false"
                aria-errormessage="field1Error" />
            <p id="field1Error" class="error" role="alert" hidden>The email is incorrect</p>

            <label for="field2">Select an option:</label>
            <select id="field2" aria-controls="field2Description">
                <option value="0">Option 1</option>
                <option value="1">Option 2</option>
                <option value="2">Option 3</option>
            </select>
            <p id="field2Description" class="description" aria-label="Description of selected option"
                aria-live="polite"></p>
            <button type="submit" aria-flowto="info">
                Submit
            </button>
        </form>
        <dialog id="modal" class="modal" role="alertdialog" aria-labelledby=modalTitle" aria-describedby="info">
            <h2 id="modalTitle">Submission result</h2>
            <button type="button" class="close" aria-label="close the dialog" aria-flowto="form">
                <i class="fa-solid fa-close"></i>
            </button>
            <div id="info"></div>
        </dialog>
    </main>

    <script type="text/javascript" src="main.js"></script>

</body>

</html>
